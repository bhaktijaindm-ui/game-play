<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="72" height="72">
  <defs>
    <!-- Background Gradient (Pink to Purple with Gold Accent) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4DAF" />
      <stop offset="55%" stop-color="#E91E8C" />
      <stop offset="100%" stop-color="#9B5DE5" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F5B700" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4A0E4E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Square App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="232" rx="112" fill="url(#glossGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.4" />

  <!-- Center Emblem: Makeup Blocks & Lipstick Hybrid -->
  <g transform="translate(136, 120)">
    <!-- 2x2 Cosmetic Puzzle Grid -->
    <!-- Top-Left Block: Eyeshadow Purple -->
    <rect x="0" y="0" width="108" height="108" rx="28" fill="#7C4DFF" stroke="#FFFFFF" stroke-width="4" />
    <rect x="14" y="14" width="80" height="36" rx="14" fill="#FFFFFF" fill-opacity="0.25" />

    <!-- Top-Right Block: Gold Highlighter -->
    <rect x="132" y="0" width="108" height="108" rx="28" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="186" cy="54" r="26" fill="#FFF9C4" fill-opacity="0.8" />
    <path d="M186 36 V44 M186 64 V72 M168 54 H176 M196 54 H204" stroke="#D97706" stroke-width="4" stroke-linecap="round" />

    <!-- Bottom-Left Block: Mint Skincare -->
    <rect x="0" y="132" width="108" height="108" rx="28" fill="#2FBF71" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 54 156 C 70 156 78 174 78 196 C 54 196 42 186 54 156 Z" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- Bottom-Right Block: Foundation & Rose Blush -->
    <rect x="132" y="132" width="108" height="108" rx="28" fill="#FF8A65" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="186" cy="186" r="30" fill="#FFAB91" />
    <circle cx="186" cy="186" r="14" fill="#FFFFFF" fill-opacity="0.6" />

    <!-- Center Hero Lipstick Bullet rising dynamically -->
    <g transform="translate(64, 40)" filter="url(#shadow)">
      <!-- Lipstick Bullet -->
      <path d="M 40 40 L 72 -30 L 104 40 Z" fill="#FF1744" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
      <path d="M 40 40 L 72 -30 V 40 Z" fill="#D50000" />
      <!-- Gold Casing Sheath -->
      <rect x="36" y="40" width="72" height="32" rx="8" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4" />
      <!-- Noir Bottom Handle -->
      <rect x="32" y="72" width="80" height="90" rx="16" fill="#2B1B2E" stroke="#FFFFFF" stroke-width="5" />
      <line x1="50" y1="84" x2="50" y2="148" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35" />
    </g>
  </g>

  <!-- Dazzling White Sparkles -->
  <!-- Top Right Big Star Sparkle -->
  <g transform="translate(400, 90)">
    <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="8" fill="#FFF9C4" />
  </g>

  <!-- Left Bottom Small Star Sparkle -->
  <g transform="translate(85, 390)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#FFFFFF" />
  </g>

  <!-- Mini Accent Sparkle -->
  <circle cx="410" cy="240" r="6" fill="#FFFFFF" />
  <circle cx="110" cy="110" r="5" fill="#FFFFFF" />
</svg>
