<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#E1BEE7" />
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#2B1B2E" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg3)" />

  <text x="540" y="220" font-family="'Fredoka', system-ui, sans-serif" font-weight="bold" font-size="64" fill="#9B5DE5" text-anchor="middle">
    LOOKS STUDIO
  </text>
  <text x="540" y="300" font-family="'Poppins', system-ui, sans-serif" font-weight="600" font-size="36" fill="#7E6382" text-anchor="middle">
    Collect &amp; Customize Glamorous Avatar Styles!
  </text>

  <g transform="translate(190, 390)" filter="url(#shadow3)">
    <rect width="700" height="1420" rx="64" fill="#FFFFFF" stroke="#F5D6E3" stroke-width="12" />
    <rect x="24" y="24" width="652" height="1372" rx="44" fill="#FFF5F8" />

    <!-- Big Center Avatar Preview -->
    <rect x="50" y="80" width="600" height="420" rx="36" fill="#FFFFFF" stroke="#F5D6E3" />
    <circle cx="350" cy="250" r="110" fill="linear-gradient(135deg, #FFD54F, #FF4DAF)" stroke="#FFFFFF" stroke-width="8" />
    <!-- Avatar head silhouette -->
    <circle cx="350" cy="250" r="70" fill="#FCD5B5" />
    <!-- Cheeks blush & lipstick -->
    <circle cx="320" cy="265" r="16" fill="#FF8A80" opacity="0.6" />
    <circle cx="380" cy="265" r="16" fill="#FF8A80" opacity="0.6" />
    <ellipse cx="350" cy="285" rx="18" ry="8" fill="#E91E8C" />

    <text x="350" y="420" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="32" fill="#2B1B2E" text-anchor="middle">
      Golden Goddess
    </text>
    <text x="350" y="460" font-family="'Poppins', sans-serif" font-size="20" fill="#7E6382" text-anchor="middle">
      24K Gold Highlighter &amp; Tiara
    </text>

    <!-- Looks Grid Thumbnails -->
    <rect x="70" y="550" width="260" height="280" rx="28" fill="#FFFFFF" stroke="#E91E8C" stroke-width="4" />
    <circle cx="200" cy="650" r="50" fill="#F5D0C5" />
    <text x="200" y="750" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="22" fill="#2B1B2E" text-anchor="middle">
      Berry Chic
    </text>

    <rect x="370" y="550" width="260" height="280" rx="28" fill="#FFFFFF" stroke="#F5D6E3" stroke-width="2" />
    <circle cx="500" cy="650" r="50" fill="#E0AC69" />
    <text x="500" y="750" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="22" fill="#2B1B2E" text-anchor="middle">
      Sunset Shimmer
    </text>

    <rect x="70" y="870" width="260" height="280" rx="28" fill="#FFFFFF" stroke="#F5D6E3" stroke-width="2" />
    <circle cx="200" cy="970" r="50" fill="#F3E5F5" />
    <text x="200" y="1070" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="22" fill="#2B1B2E" text-anchor="middle">
      Cyber Glam
    </text>

    <rect x="370" y="870" width="260" height="280" rx="28" fill="#FFFFFF" stroke="#F5D6E3" stroke-width="2" />
    <circle cx="500" cy="970" r="50" fill="#EFEBE9" />
    <text x="500" y="1070" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="22" fill="#2B1B2E" text-anchor="middle">
      Gothic Velvet
    </text>
  </g>
</svg>
