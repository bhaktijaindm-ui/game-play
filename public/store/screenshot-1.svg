<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#2B1B2E" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg1)" />

  <!-- Catchy Store Caption -->
  <text x="540" y="220" font-family="'Fredoka', system-ui, sans-serif" font-weight="bold" font-size="64" fill="#E91E8C" text-anchor="middle">
    CHIC MAKEUP PUZZLE
  </text>
  <text x="540" y="300" font-family="'Poppins', system-ui, sans-serif" font-weight="600" font-size="36" fill="#7E6382" text-anchor="middle">
    Drag, Place &amp; Clear Cosmetic Blocks!
  </text>

  <!-- Mobile Device Frame Mockup -->
  <g transform="translate(190, 390)" filter="url(#shadow1)">
    <!-- Device Body -->
    <rect width="700" height="1420" rx="64" fill="#FFFFFF" stroke="#F5D6E3" stroke-width="12" />
    <!-- Screen Glass -->
    <rect x="24" y="24" width="652" height="1372" rx="44" fill="#FFF5F8" />

    <!-- Top HUD Preview -->
    <rect x="50" y="60" width="180" height="70" rx="22" fill="#FFFFFF" stroke="#F5D6E3" />
    <text x="140" y="105" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="28" fill="#E91E8C" text-anchor="middle">
      14,850
    </text>

    <!-- 8x8 Board Container -->
    <rect x="50" y="220" width="600" height="600" rx="36" fill="#FFFFFF" stroke="#F5D6E3" stroke-width="4" />
    <g transform="translate(68, 238)">
      <!-- Filled grid blocks -->
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#FF4DAF" />
      <rect x="72" y="0" width="64" height="64" rx="14" fill="#FF4DAF" />
      <rect x="144" y="0" width="64" height="64" rx="14" fill="#FF4DAF" />

      <rect x="288" y="72" width="64" height="64" rx="14" fill="#9B5DE5" />
      <rect x="360" y="72" width="64" height="64" rx="14" fill="#9B5DE5" />
      <rect x="432" y="72" width="64" height="64" rx="14" fill="#9B5DE5" />

      <rect x="144" y="216" width="64" height="64" rx="14" fill="#F5B700" />
      <rect x="216" y="216" width="64" height="64" rx="14" fill="#F5B700" />
      <rect x="144" y="288" width="64" height="64" rx="14" fill="#F5B700" />
      <rect x="216" y="288" width="64" height="64" rx="14" fill="#F5B700" />

      <!-- Ghost preview snapping -->
      <rect x="0" y="432" width="64" height="64" rx="14" fill="#2FBF71" fill-opacity="0.5" stroke="#2FBF71" stroke-width="3" />
      <rect x="72" y="432" width="64" height="64" rx="14" fill="#2FBF71" fill-opacity="0.5" stroke="#2FBF71" stroke-width="3" />
      <rect x="144" y="432" width="64" height="64" rx="14" fill="#2FBF71" fill-opacity="0.5" stroke="#2FBF71" stroke-width="3" />
    </g>

    <!-- Tray Shapes Preview -->
    <rect x="50" y="900" width="600" height="200" rx="32" fill="#FFFFFF" stroke="#F5D6E3" />
    <g transform="translate(100, 940)">
      <rect x="0" y="0" width="40" height="40" rx="10" fill="#E91E8C" />
      <rect x="46" y="0" width="40" height="40" rx="10" fill="#E91E8C" />
      <rect x="92" y="0" width="40" height="40" rx="10" fill="#E91E8C" />
    </g>

    <g transform="translate(300, 940)">
      <rect x="0" y="0" width="40" height="40" rx="10" fill="#FF8A65" />
      <rect x="0" y="46" width="40" height="40" rx="10" fill="#FF8A65" />
      <rect x="46" y="46" width="40" height="40" rx="10" fill="#FF8A65" />
    </g>

    <g transform="translate(480, 940)">
      <rect x="0" y="0" width="40" height="40" rx="10" fill="#2FBF71" />
      <rect x="0" y="46" width="40" height="40" rx="10" fill="#2FBF71" />
    </g>
  </g>
</svg>
