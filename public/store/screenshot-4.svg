<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="100%" stop-color="#FFECB3" />
    </linearGradient>
    <filter id="shadow4">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#2B1B2E" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg4)" />

  <text x="540" y="220" font-family="'Fredoka', system-ui, sans-serif" font-weight="bold" font-size="64" fill="#D97706" text-anchor="middle">
    HALL OF GLAM
  </text>
  <text x="540" y="300" font-family="'Poppins', system-ui, sans-serif" font-weight="600" font-size="36" fill="#7E6382" text-anchor="middle">
    Climb the Weekly Global Leaderboard!
  </text>

  <g transform="translate(190, 390)" filter="url(#shadow4)">
    <rect width="700" height="1420" rx="64" fill="#FFFFFF" stroke="#F5D6E3" stroke-width="12" />
    <rect x="24" y="24" width="652" height="1372" rx="44" fill="#FFF5F8" />

    <!-- Top 3 Podium Cards -->
    <g transform="translate(50, 80)">
      <!-- Rank 1 Card -->
      <rect x="0" y="0" width="600" height="100" rx="24" fill="#FFFFFF" stroke="#F5B700" stroke-width="3" />
      <circle cx="50" cy="50" r="24" fill="#F5B700" />
      <text x="50" y="58" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="22" fill="#2B1B2E" text-anchor="middle">1</text>
      <circle cx="120" cy="50" r="28" fill="#FCD5B5" />
      <text x="170" y="58" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#2B1B2E">Bella Chic</text>
      <text x="550" y="58" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#E91E8C" text-anchor="end">48,920</text>

      <!-- Rank 2 Card -->
      <rect x="0" y="120" width="600" height="100" rx="24" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2" />
      <circle cx="50" cy="170" r="24" fill="#E0E0E0" />
      <text x="50" y="178" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="22" fill="#2B1B2E" text-anchor="middle">2</text>
      <circle cx="120" cy="170" r="28" fill="#F3E5F5" />
      <text x="170" y="178" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#2B1B2E">Aria Glow</text>
      <text x="550" y="178" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#E91E8C" text-anchor="end">42,150</text>

      <!-- Rank 3 Card -->
      <rect x="0" y="240" width="600" height="100" rx="24" fill="#FFFFFF" stroke="#FFCCBC" stroke-width="2" />
      <circle cx="50" cy="290" r="24" fill="#FFAB91" />
      <text x="50" y="298" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="22" fill="#2B1B2E" text-anchor="middle">3</text>
      <circle cx="120" cy="290" r="28" fill="#EFEBE9" />
      <text x="170" y="298" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#2B1B2E">Chloe Velvet</text>
      <text x="550" y="298" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#E91E8C" text-anchor="end">38,740</text>
    </g>

    <!-- Player Sticky Rank -->
    <rect x="50" y="1230" width="600" height="110" rx="28" fill="#E91E8C" />
    <text x="80" y="1295" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">
      Your Rank: #14
    </text>
    <text x="580" y="1295" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#FFFFFF" text-anchor="end">
      24,190 pts
    </text>
  </g>
</svg>
